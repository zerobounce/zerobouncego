# Run unit tests on every PR (-short skips integration tests that need API key).
name: SDK CI

on:
  # Started by dependabot-auto-merge.yml after it merges: a merge made with GITHUB_TOKEN
  # starts no push workflows.
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The minimum go.mod declares, read from its `go` line so the floor
          # tested is always the floor published. With GOTOOLCHAIN=local,
          # setup-go reads the `go` line even if a `toolchain` line is added.
          - label: go.mod minimum
            go-version-file: go.mod
          - label: "1.27"
            go-version: "1.27"
    env:
      # Run the toolchain setup-go installs, never one go.mod asks to download.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go-version }}
          go-version-file: ${{ matrix.go-version-file }}

      - name: Go version
        run: go version

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test ./... -cover -short -v
