name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        description: Tag to publish (e.g. v2.1.3)
        required: true

permissions:
  contents: read

jobs:
  validate-tag:
    outputs:
      tag_sha: ${{ steps.tag_sha.outputs.sha }}
    name: Validate tag
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag input
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          re='^v?[0-9]+\.[0-9]+\.[0-9]+([.+-][0-9A-Za-z.-]+)?$'
          if [[ ! "$TAG" =~ $re ]]; then
            echo "Error: the tag input must be a release tag such as v1.2.3."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: refs/tags/${{ github.event.inputs.tag }}

          persist-credentials: false
      - name: Verify tag, version.go, and go.mod module path
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            echo "Error: Tag is required."
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Error: Tag '$TAG' does not exist."
            exit 1
          fi
          TAG_VERSION="${TAG#v}"
          PKG_VERSION=$(grep 'const Version' version.go | sed -E 's/.*"(.*)".*/\1/')
          if [ -z "$PKG_VERSION" ]; then
            echo "Error: Could not read version from version.go"
            exit 1
          fi
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: version.go ($PKG_VERSION) does not match tag ($TAG)."
            exit 1
          fi
          MODULE=$(grep '^module ' go.mod | awk '{print $2}')
          MAJOR="${TAG_VERSION%%.*}"
          if [ "$MAJOR" -ge 2 ] 2>/dev/null; then
            EXPECTED="/v${MAJOR}"
            case "$MODULE" in
              *"${EXPECTED}") ;;
              *)
                echo "Error: go.mod module ($MODULE) must end with ${EXPECTED} for tag $TAG."
                exit 1
                ;;
            esac
          fi
          
      - name: Record tag commit SHA
        id: tag_sha
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          SHA=$(git rev-parse "refs/tags/$TAG^{commit}")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: [validate-tag]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.inputs.tag }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27"

      - name: Run tests
        run: go test ./... -cover -short -v

  release:
    name: Create GitHub Release
    needs: [validate-tag, test]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-tag.outputs.tag_sha }}
          fetch-depth: 0

          persist-credentials: false
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes
          fi

  verify-proxy:
    name: Verify pkg.go.dev proxy
    needs: [release]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for proxy.golang.org to index tag
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          URL="https://proxy.golang.org/github.com/zerobounce/zerobouncego/v2/@v/${TAG}.info"
          echo "Checking $URL"
          for i in $(seq 1 20); do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' "$URL" || true)
            if [ "$CODE" = "200" ]; then
              echo "Proxy indexed $TAG (attempt $i)."
              exit 0
            fi
            echo "Attempt $i: HTTP $CODE — waiting 15s..."
            sleep 15
          done
          echo "Warning: proxy did not return 200 for $TAG within 5 minutes."
          echo "pkg.go.dev may still index shortly; verify manually:"
          echo "  go get github.com/zerobounce/zerobouncego/v2@${TAG#v}"
          exit 1
